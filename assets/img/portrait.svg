<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" width="600" height="760" role="img" aria-labelledby="portraitTitle">
  <title id="portraitTitle">Backlit portrait silhouette of Hanifeh Farahzadi</title>
  <defs>
    <radialGradient id="backlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#efe6ff" stop-opacity=".62"/>
      <stop offset="34%" stop-color="#c4b5fd" stop-opacity=".34"/>
      <stop offset="62%" stop-color="#8b5cf6" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="faceTone" cx="34%" cy="32%" r="78%">
      <stop offset="0%" stop-color="#6b4f6b"/>
      <stop offset="42%" stop-color="#3d2745"/>
      <stop offset="100%" stop-color="#120a1e"/>
    </radialGradient>
    <linearGradient id="bodyFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d1229"/>
      <stop offset="55%" stop-color="#0e0718"/>
      <stop offset="100%" stop-color="#08040f"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ddd0ff"/>
      <stop offset="62%" stop-color="#a78bfa" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rimCool" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a5f3fc" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08040f" stop-opacity="1"/>
      <stop offset="100%" stop-color="#08040f" stop-opacity="0"/>
    </linearGradient>
    <filter id="blurSm" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="blurMd" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="blurLg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <clipPath id="headClip">
      <path d="M236 440c-4-60 24-104 64-104s68 44 64 104c-2 34-16 62-38 78v36h-52v-36c-22-16-36-44-38-78Z"/>
    </clipPath>
  </defs>

  <g transform="translate(300 760) scale(1.16) translate(-300 -760)">
  <!-- rim glow behind the subject -->
  <ellipse cx="300" cy="368" rx="252" ry="304" fill="url(#backlight)"/>
  <ellipse cx="300" cy="360" rx="206" ry="248" fill="none" stroke="#e9d5ff" stroke-opacity=".16" stroke-width="1"/>
  <ellipse cx="300" cy="360" rx="236" ry="278" fill="none" stroke="#e9d5ff" stroke-opacity=".08" stroke-width="1" stroke-dasharray="2 12"/>

  <!-- body + hood silhouette -->
  <path d="M86 760c4-92 24-166 86-208 36-24 76-38 96-46-24-18-38-46-40-74-4-66 26-114 72-114s76 48 72 114c-2 28-16 56-40 74 20 8 60 22 96 46 62 42 82 116 86 208Z" fill="url(#bodyFill)"/>
  <path d="M86 760c4-92 24-166 86-208 36-24 76-38 96-46-24-18-38-46-40-74-4-66 26-114 72-114s76 48 72 114c-2 28-16 56-40 74 20 8 60 22 96 46 62 42 82 116 86 208" fill="none" stroke="url(#rim)" stroke-width="2.6" stroke-linecap="round"/>

  <!-- hood opening -->
  <g clip-path="url(#headClip)">
    <path d="M224 400c0-52 32-88 76-88s76 36 76 88c0 50-32 86-76 86s-76-36-76-86Z" fill="url(#faceTone)"/>
    <!-- hood shadow around the face -->
    <path d="M210 356c18 34 50 54 90 54s72-20 90-54v60c-30 32-56 46-90 46s-60-14-90-46Z" fill="#07020d" opacity=".75" filter="url(#blurMd)"/>
    <!-- soft light on the cheek -->
    <ellipse cx="262" cy="452" rx="26" ry="44" fill="#e9d5ff" opacity=".18" filter="url(#blurMd)"/>
    <!-- shading on the shadow side -->
    <ellipse cx="342" cy="452" rx="42" ry="70" fill="#0a0412" opacity=".55" filter="url(#blurMd)"/>
  </g>
  <!-- face rim -->
  <path d="M236 438c-4-56 24-98 64-100" fill="none" stroke="url(#rim)" stroke-width="2" stroke-linecap="round" opacity=".75"/>

  <!-- hairline inside the hood -->
  <path d="M238 410c8-34 32-56 62-56s54 22 62 56" fill="none" stroke="#08040f" stroke-width="20" stroke-linecap="round" filter="url(#blurSm)"/>

  <!-- jacket structure -->
  <g opacity=".9">
    <path d="M268 512c-18 10-36 26-44 44 28 18 56 26 76 28v-64Z" fill="#150c21"/>
    <path d="M332 512c18 10 36 26 44 44-28 18-56 26-76 28v-64Z" fill="#0c0615"/>
    <path d="M268 510c-8 34-12 66-14 96 20 10 42 16 64 18l-2-108Z" fill="#1a1027"/>
    <path d="M332 510c8 34 12 66 14 96-20 10-42 16-64 18l2-108Z" fill="#100918"/>
    <path d="M300 578v156" stroke="#c4b5fd" stroke-opacity=".22" stroke-width="2"/>
    <!-- lapel light -->
    <path d="M268 512c-16 26-24 56-28 88" fill="none" stroke="url(#rim)" stroke-width="1.6" opacity=".5"/>
    <path d="M332 512c16 26 24 56 28 88" fill="none" stroke="url(#rimCool)" stroke-width="1.4" opacity=".4"/>
    <!-- shoulder seams -->
    <path d="M170 592c-38 42-56 102-60 168" fill="none" stroke="#8a76ad" stroke-opacity=".22" stroke-width="1.6"/>
    <path d="M432 594c36 42 52 100 56 166" fill="none" stroke="#8a76ad" stroke-opacity=".16" stroke-width="1.6"/>
    <!-- drawstrings -->
    <path d="M274 520c-4 34-8 62-12 86" fill="none" stroke="#c4b5fd" stroke-opacity=".45" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M326 520c4 34 8 62 12 86" fill="none" stroke="#c4b5fd" stroke-opacity=".3" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="262" cy="608" r="3" fill="#c4b5fd" opacity=".55"/>
    <circle cx="338" cy="608" r="3" fill="#c4b5fd" opacity=".4"/>
  </g>

  <!-- shoulder light -->
  <path d="M150 610c-34 40-50 96-54 150h44c4-58 16-112 34-142Z" fill="#e9d5ff" opacity=".07" filter="url(#blurMd)"/>

  <!-- sparkles -->
  <circle cx="184" cy="466" r="2.2" fill="#f5edff" opacity=".85"/>
  <circle cx="202" cy="508" r="1.3" fill="#f5edff" opacity=".55"/>
  <circle cx="170" cy="430" r="1.1" fill="#f5edff" opacity=".4"/>
  <circle cx="418" cy="492" r="1.7" fill="#a5f3fc" opacity=".4"/>
  <circle cx="436" cy="452" r="1.1" fill="#a5f3fc" opacity=".28"/>

  <ellipse cx="300" cy="748" rx="214" ry="26" fill="#07020d" opacity=".7" filter="url(#blurLg)"/>
  </g>
</svg>
